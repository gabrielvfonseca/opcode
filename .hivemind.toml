[land]
branch = "dev"
batch_max = 4
verify = [
  "cargo test --locked --workspace --lib",
  "[ -d sdk/node_modules ] || (cd sdk && bun install --frozen-lockfile)",
  "OPCODE_TEAM_ID=${OPCODE_TEAM_ID:-QC99C9JE59} OPCODE_CAPTURE=1 OPCODE_LOCAL_BUILD=1 scripts/build-app.sh",
]

[land.app]
target = "/Applications/Opcode.app"
bundle = "target/app/Opcode.app"
id = "anomaly.opcode"
exe = "opcode"
wait_idle = 30
install_cmd = "if [ -x \"$HOME/Library/Caches/opcode-install/install-gate.sh\" ]; then while [ \"$(\"$HOME/Library/Caches/opcode-install/install-gate.sh\")\" != ready ]; do sleep 5; done; fi && if [ -f \"$HOME/code/home/tools/opcode-autobuild/install.py\" ]; then python3 \"$HOME/code/home/tools/opcode-autobuild/install.py\" \"${HIVEMIND_LAND_HEAD:0:8}\" \"$PWD/target/app/Opcode.app\"; else rm -rf /Applications/Opcode.app && ditto \"$PWD/target/app/Opcode.app\" /Applications/Opcode.app && open -g /Applications/Opcode.app; fi"
stamp = "~/Library/Caches/opcode-install/installed-rev"
