name: OPCODEMobile
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.kitlangton.opcode
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "2660"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5
settings:
  base:
    DEVELOPMENT_TEAM: QC99C9JE59
    SWIFT_VERSION: 6.0
targets:
  OPCODEMobile:
    type: application
    platform: iOS
    sources:
      - OPCODEMobile
      - OPCODEShared
      - OPCODEActivity
      - path: ../app/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - target: OPCODEKeyboard
        embed: true
      - target: OPCODEWidgets
        embed: true
    info:
      path: OPCODEMobile/Info.plist
      properties:
        CFBundleDisplayName: Opcode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.kitlangton.opcode.mobile.keyboard-session
            CFBundleURLSchemes:
              - opcode-dictation
        NSMicrophoneUsageDescription: Opcode records only while you dictate and transcribes locally on this iPhone.
        NSSpeechRecognitionUsageDescription: Opcode uses Apple's on-device SpeechTranscriber to turn your recording into text.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OPCODEMobile/OPCODEMobile.entitlements
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.opcode.mobile
        PRODUCT_NAME: OPCODE
    scheme:
      gatherCoverageData: false
      testTargets:
        - OPCODEMobileTests
  OPCODEKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - OPCODEKeyboard
      - OPCODEShared
    info:
      path: OPCODEKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Opcode Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: OPCODEKeyboard/OPCODEKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.opcode.mobile.keyboard
        PRODUCT_NAME: OPCODEKeyboard
        SKIP_INSTALL: YES
  OPCODEWidgets:
    type: app-extension
    platform: iOS
    sources:
      - OPCODEWidgets
      - OPCODEActivity
      - OPCODEShared/OpcodeTheme.swift
    info:
      path: OPCODEWidgets/Info.plist
      properties:
        CFBundleDisplayName: Opcode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.opcode.mobile.widgets
        PRODUCT_NAME: OPCODEWidgets
        SKIP_INSTALL: YES
  OPCODEMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OPCODEMobileTests
      - path: ../tests/fixtures/vocabulary/audio/term-opcode-1.wav
        buildPhase: resources
    dependencies:
      - target: OPCODEMobile
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.opcode.mobile.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OPCODE.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OPCODE
